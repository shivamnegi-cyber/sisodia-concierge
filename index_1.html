<title>Sisodia Bagh Concierge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Kumbh+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light;
  --deep:#00173D; --navy:#012964; --ink:#192A39; --cream:#FFF8EB; --white:#FFFFFF;
  --line:#E7DFCF; --line2:#D8CFBD; --muted:#5A6472; --soft:#D9D2C3; --tint:#F3F5FA;
  --amber-bg:#FDF0DC; --amber:#8A4B00; --blue-bg:#E3E9F5; --green-bg:#E1F1E5; --green:#1E6B30;
  --display:'Outfit', 'Segoe UI', system-ui, sans-serif;
  --body:'Kumbh Sans', 'Segoe UI', system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#E9E4D8;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--navy)}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;background:var(--cream);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(0,23,61,.12)}
.logo{display:block;color:inherit}
/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--deep);color:var(--cream);height:68px;padding:0 16px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hdr .brand{display:flex;flex-direction:column;gap:3px}
.hdr .brand small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.hdr .who{display:flex;align-items:center;gap:10px;text-align:right}
.hdr .who b{display:block;font-size:14px;font-weight:600}
.hdr .who span{font-size:12px;color:var(--soft)}
.iconbtn{width:44px;height:44px;border-radius:999px;border:1px solid #3A4D6B;background:transparent;color:var(--cream);display:inline-flex;align-items:center;justify-content:center}
.linkbtn{background:none;border:none;padding:0;color:var(--soft);font-size:12px;text-decoration:underline}
main{flex:1;display:flex;flex-direction:column}
.page{padding:18px 16px 24px;display:flex;flex-direction:column;gap:14px}
h1.t{font-family:var(--display);font-weight:300;font-size:26px;line-height:1.2;color:var(--deep);margin:0;text-wrap:balance}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.btn{height:48px;padding:0 22px;border:none;border-radius:999px;background:var(--navy);color:var(--cream);font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.sm{height:40px;padding:0 16px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--navy);color:var(--navy)}
.btn.light{background:var(--cream);color:var(--deep)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{height:40px;padding:0 14px;border:1px solid var(--line2);border-radius:999px;background:var(--cream);font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.received{background:var(--amber-bg);color:var(--amber)}
.pill.accepted{background:var(--blue-bg);color:var(--navy)}
.pill.completed{background:var(--green-bg);color:var(--green)}
.pill.cancelled{background:#EEE;color:#555}
/* chat feed */
.row{display:flex;gap:10px;align-items:flex-start}
.av{width:32px;height:32px;flex-shrink:0;border-radius:999px;background:var(--deep);display:flex;align-items:center;justify-content:center}
.bub{background:var(--white);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;max-width:320px}
.bub.me{margin-left:auto;background:var(--navy);color:var(--cream);border-color:var(--navy);border-radius:18px 4px 18px 18px}
.bub .time{font-size:11px;color:var(--muted);margin-top:4px}
.bub.me .time{color:#C9D3E6;text-align:right}
.indent{margin-left:42px}
.today{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.today .card{padding:12px;border-radius:14px}
.today b{display:block;font-size:14px;margin-top:4px}
.today span{font-size:12px;color:var(--muted)}
.feature{background:var(--deep);color:var(--cream);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;border:none}
.feature .eyebrow{color:var(--soft)}
.feature h3{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.3;margin:0}
.rq{display:flex;flex-direction:column;gap:10px;width:100%;text-align:left;cursor:pointer}
.rq .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rq .top b{font-size:14px}
.rq .items{font-size:14px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.steps i{height:4px;border-radius:4px;background:var(--line)}
.steps i.on{background:var(--navy)}
.steps.done i{background:var(--green)}
.rq .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.composer{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom,0px));z-index:15;padding:8px 16px;background:var(--cream);border-top:1px solid var(--line);display:flex;gap:8px}
.composer input{flex:1;height:44px;border:1px solid var(--line2);border-radius:999px;padding:0 16px;background:var(--white)}
.send{width:44px;height:44px;border:none;border-radius:999px;background:var(--navy);color:var(--cream);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
/* tab bar */
nav.tabs{position:sticky;bottom:0;z-index:16;background:var(--white);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{height:68px;border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted)}
nav.tabs button.on{color:var(--navy);font-weight:700}
/* forms / lists */
.list{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:4px 16px}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #EFE8DA;font-size:14px}
.li:last-child{border-bottom:none}
.li .k{color:var(--muted)}
.li .v{font-weight:600;text-align:right}
.acc{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.acc.open{border-color:var(--navy)}
.acc>button{width:100%;height:50px;border:none;background:none;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font-weight:600;font-size:15px;text-align:left}
.count{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--navy);color:var(--cream);font-size:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 12px 5px 16px;border-top:1px solid var(--line)}
.item.sel{background:var(--tint)}
.item.sel .nm{color:var(--navy);font-weight:600}
.item .nm{font-size:15px}
.item .nm small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
.stepper button{width:40px;height:40px;border-radius:999px;border:1px solid var(--line2);background:var(--white);color:var(--navy);font-size:19px;line-height:1}
.stepper button.plus{background:var(--navy);border-color:var(--navy);color:var(--cream)}
.stepper button[disabled]{opacity:.35;cursor:not-allowed}
.stepper span{width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--white);cursor:pointer}
.opt.on{border-color:var(--navy);background:var(--tint)}
.opt input{accent-color:var(--navy);width:18px;height:18px;flex-shrink:0}
.opt .nm{flex:1;font-size:15px}
.opt .nm small{display:block;color:var(--muted);font-size:12px}
.opt .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr s{color:var(--muted);font-weight:400;margin-right:4px}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.field input,.field select,.field textarea,.note{height:48px;border:1px solid var(--line2);border-radius:14px;padding:0 14px;background:var(--white);font-size:15px;font-weight:400}
.field textarea,textarea.note{height:auto;min-height:72px;padding:12px 14px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sheethead{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:12;background:var(--cream);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
.back{background:none;border:none;font-weight:600;color:var(--navy);min-height:44px;padding:0;font-size:14px}
.sendbar{position:sticky;bottom:0;z-index:15;background:var(--white);border-top:1px solid var(--line);padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.sendbar b{display:block;font-size:15px}
.sendbar span{font-size:13px;color:var(--muted)}
.secttl{font-family:var(--display);font-weight:500;font-size:17px;color:var(--deep);margin:6px 0 0}
.veg{display:inline-block;width:10px;height:10px;border:1.5px solid #1E7B34;border-radius:2px;position:relative;margin-right:6px;vertical-align:middle}
.veg::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#1E7B34}
.veg.nv{border-color:#A0361C}.veg.nv::after{background:#A0361C}
/* timeline */
.tl{display:flex;flex-direction:column}
.tl .s{display:flex;gap:12px}
.tl .dot{display:flex;flex-direction:column;align-items:center}
.tl .dot i{width:22px;height:22px;border-radius:999px;border:2px solid var(--line2);background:var(--white);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-style:normal}
.tl .dot i.ok{background:var(--green);border-color:var(--green)}
.tl .dot i.now{border:6px solid var(--navy)}
.tl .dot em{width:2px;height:28px;background:var(--line)}
.tl .dot em.ok{background:var(--green)}
.tl .lbl{flex:1;display:flex;justify-content:space-between;gap:8px;font-size:15px}
.tl .lbl span{font-size:13px;color:var(--muted);white-space:nowrap}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--cream);display:inline-flex;align-items:center;justify-content:center}
.stars button.on{background:var(--navy);border-color:var(--navy)}
.stars button.on path{fill:var(--cream);stroke:var(--cream)}
.wifi{background:var(--navy);color:var(--cream);border:none}
.wifi small{color:#C9D3E6;font-size:12px;display:block}
.wifi b{font-size:16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--deep);color:var(--cream);padding:12px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:360px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.empty{font-size:14px;color:var(--muted)}
/* login */
.login{background:var(--deep);color:var(--cream);min-height:100%;padding:64px 22px 28px;display:flex;flex-direction:column;align-items:center;gap:26px}
.login .greet{font-family:var(--display);font-weight:300;font-size:28px;line-height:1.3;text-align:center;margin:0}
.login .card{width:100%;background:var(--cream);color:var(--ink);border:none;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.login .err{color:#A0361C;font-size:13px;font-weight:600}
.demo{width:100%;border:1px dashed #3A4D6B;border-radius:14px;padding:12px 14px;font-size:13px;color:var(--soft)}
.demo b{color:var(--cream)}
.foot{margin-top:auto;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);text-align:center}
@media (prefers-reduced-motion: no-preference){.toast{animation:up .25s ease-out}@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}}

/* staff console */
body.staffmode{background:var(--cream)}
.app.staff{max-width:none;box-shadow:none}
.app.staff .login{min-height:100vh}
.shdr{padding:0 20px}
.stabs{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:18;background:var(--white);border-bottom:1px solid var(--line);display:flex;gap:4px;padding:0 12px;align-items:center;overflow-x:auto}
.stabs button{height:50px;padding:0 14px;border:none;background:none;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.stabs button.on{color:var(--navy);border-bottom-color:var(--navy)}
.live{margin-left:auto;font-size:12px;font-weight:700;color:var(--green);display:inline-flex;align-items:center;gap:6px;padding-right:6px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--green)}
.spage{padding:18px 20px 40px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:400;color:var(--deep);font-variant-numeric:tabular-nums;margin-top:2px}
.stat span{font-size:13px;color:var(--muted)}
.warn{color:#A0361C;font-style:normal;font-weight:700}
.chip .n{margin-left:6px;font-size:12px;opacity:.75}
.scols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.scols section{display:flex;flex-direction:column;gap:10px}
.sh{font-family:var(--display);font-weight:500;font-size:17px;color:var(--deep);margin:0;display:flex;gap:8px;align-items:center}
.sh span{font-size:13px;color:var(--muted);font-family:var(--body)}
.scard{display:flex;flex-direction:column;gap:8px}
.scard.od{border-color:#C2410C;box-shadow:0 0 0 1px #C2410C inset}
.shead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.sroom{font-weight:700;font-size:15px;color:var(--deep)}
.pill.late{background:#FBE3D8;color:#9A2F0E}
.sitems{margin:0;padding-left:18px;font-size:14px}
.sline{font-size:14px}
.sline span{display:inline-block;min-width:48px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.stimes{font-size:12px;color:var(--muted);border-top:1px solid #EFE8DA;padding-top:8px}
.sacts{display:flex;gap:8px;flex-wrap:wrap}
.chatwrap{display:grid;grid-template-columns:minmax(240px,340px) minmax(0,1fr);gap:14px;align-items:start}
.threads{display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow:auto}
.thread{display:flex;justify-content:space-between;gap:8px;text-align:left;border:none;background:none;border-radius:12px;padding:10px;min-height:52px}
.thread.on{background:var(--tint)}
.thread b{display:block;font-size:14px}
.thread span{font-size:13px;color:var(--muted)}
.thread small{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.convo{display:flex;flex-direction:column;min-height:420px}
.msgs{flex:1;display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto;padding:4px 2px}
.roomgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.rcard{padding:12px}
.rcard b{font-family:var(--display);font-size:22px;font-weight:500;color:var(--deep)}
.rcard.occ{border-color:var(--navy)}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,23,61,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.alertbox{background:var(--deep);color:var(--cream);border-radius:22px;padding:28px 24px;max-width:420px;width:100%;text-align:center;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.alertbox h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0}
.alertbox p{margin:0;font-size:16px}
.pulse{width:64px;height:64px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;margin:0 auto 6px}
@media (prefers-reduced-motion: no-preference){.pulse{animation:pulse 1.2s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 14px rgba(255,248,235,.12)}}}
@media (max-width:900px){.scols{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.chatwrap{grid-template-columns:minmax(0,1fr)}}

/* admin console */
.ashell{display:grid;grid-template-columns:220px minmax(0,1fr);align-items:start}
.aside{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 68px);background:var(--white)}
.aside button{text-align:left;border:none;background:none;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.aside button.on{background:var(--tint);color:var(--navy)}
.aside .dot{width:8px;height:8px;border-radius:50%;background:#C2410C;display:inline-block}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.abar{display:flex;gap:8px;flex-wrap:wrap}
.alist{display:flex;flex-direction:column;gap:10px}
.arow{display:flex;flex-direction:column;gap:10px}
.arow.off{background:#FBF8F1;border-style:dashed}
.agrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.af{font-size:12px;color:var(--muted)}
.af input,.af select,.af textarea{height:42px;font-size:14px;color:var(--ink);border-radius:10px}
.af textarea{height:auto;min-height:64px}
.af.s2{grid-column:span 2}.af.s3{grid-column:span 3}
.abool{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-height:40px}
.abool input{width:18px;height:18px;accent-color:var(--navy)}
.chipbool{border:1px solid var(--line2);border-radius:999px;padding:0 12px;background:var(--white);font-weight:500}
.atools{display:flex;gap:6px;justify-content:flex-end;border-top:1px solid #EFE8DA;padding-top:8px}
.tbtn{height:34px;min-width:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--white);font-size:13px}
.tbtn.del{color:#9A2F0E;border-color:#E8C4B4}
.tbtn[disabled]{opacity:.35}
.note2{font-size:14px;background:var(--tint);border-color:#D5DDEC}
.fdgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;align-items:start}
.minigrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--cream)}
.mini b{display:block;font-family:var(--display);font-size:18px;font-weight:500;color:var(--deep)}
.mini span{font-size:11px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini.occ{background:var(--navy);border-color:var(--navy)}.mini.occ b,.mini.occ span{color:var(--cream)}
.mini.late{background:#C2410C;border-color:#C2410C}
.atable{width:100%;border-collapse:collapse;font-size:14px;min-width:860px}
.atable th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:12px;border-bottom:1px solid var(--line)}
.atable td{padding:12px;border-bottom:1px solid #EFE8DA;vertical-align:top}
.atable td small{color:var(--muted)}
.atable .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.atable .acts .btn{height:34px;padding:0 12px;font-size:12px}
.editrow td{background:var(--tint)}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--tint);padding:2px 6px;border-radius:6px}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.qrcard{display:flex;flex-direction:column;gap:10px}
.qrcard img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:var(--cream)}
.sharebox{max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto}
.codes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.codes div{background:var(--tint);border-radius:12px;padding:12px}
.codes small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.codes b{font-size:24px;font-family:ui-monospace,Menlo,monospace;color:var(--deep)}
@media (max-width:900px){.ashell{grid-template-columns:minmax(0,1fr)}.aside{position:static;flex-direction:row;overflow-x:auto;min-height:0;border-right:none;border-bottom:1px solid var(--line)}.aside button{white-space:nowrap}.agrid{grid-template-columns:repeat(2,minmax(0,1fr))}.af.s3{grid-column:span 2}.fdgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.agrid{grid-template-columns:minmax(0,1fr)}.af.s2,.af.s3{grid-column:auto}}

.pill.closed{background:#EEE9E0;color:#5A4A36}
.ktiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.ktile{display:flex;flex-direction:column;gap:4px}
.kv{font-family:var(--display);font-size:30px;font-weight:400;color:var(--deep);font-variant-numeric:tabular-nums}
.kv small{font-size:15px;color:var(--muted);margin-left:2px}
.kfoot{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--muted)}
.kst{font-size:12px;font-weight:700;white-space:nowrap}.kst.ok{color:var(--green)}.kst.bad{color:#9A2F0E}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.dgrid .span2{grid-column:span 2}
.dtable{min-width:520px}
.hbars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.hb{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{height:10px;background:#F1EBDF;border-radius:4px;overflow:hidden}
.ht i{display:block;height:100%;background:var(--navy);border-radius:0 4px 4px 0}
.hv{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.hv small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.colchart{width:100%;height:auto;display:block;margin-top:8px}
.colchart .grid{stroke:#EFE8DA;stroke-width:1}.colchart .base{stroke:#CFC6B4;stroke-width:1}
.colchart .ax{fill:#5A6472;font-size:10px;font-family:var(--body)}
.colchart .bar{fill:#012964}.colchart .col:hover .bar{fill:#00173D}
@media (max-width:1100px){.ktiles{grid-template-columns:repeat(2,minmax(0,1fr))}.dgrid{grid-template-columns:minmax(0,1fr)}.dgrid .span2{grid-column:auto}}

.fbq{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--cream);border:1px solid var(--line)}
.fbq.low{border-color:#E8C4B4;background:#FDF6F2}
.stars button{flex-shrink:0}
</style>
</head>

/* live(): subscribe with an instant first read, automatic re-subscribe on any error, and a slow safety poll */
function live(ref, onData, label){
  let un = null, dead = false, lastAt = 0, tries = 0;
  const deliver = snap => { lastAt = Date.now(); tries = 0; try { onData(snap); } catch(e){ console.error(label, e); } };
  const sub = () => { if (dead) return; try { un = ref.onSnapshot(deliver, () => { un = null; setTimeout(sub, Math.min(15000, 1500 * ++tries)); }); } catch(e){ setTimeout(sub, 3000); } };
  if (MODE !== 'firebase') ref.get().then(s => { if (!lastAt) deliver(s); }).catch(()=>{});
  sub();
  const poll = MODE === 'claude' ? setInterval(() => { if (dead) return; if (Date.now() - lastAt > 45000) ref.get().then(deliver).catch(()=>{}); }, 20000) : 0;
  return () => { dead = true; clearInterval(poll); if (un) try { un(); } catch(e){} };
}

/* ---------- local demo store (no backend): localStorage + cross-tab sync ---------- */
function localDb(){
  const KEY = 'sb_localdb_v1'; let st = {};
  const load = () => { try { st = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ st = st || {}; } };
  load();
  const subs = new Set(); let pend = false;
  const fire = () => { if (pend) return; pend = true; setTimeout(() => { pend = false; subs.forEach(f => f()); }, 0); };
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel('sb_localdb') : null;
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} if (bc) bc.postMessage(1); fire(); };
  if (bc) bc.onmessage = () => { load(); fire(); };
  window.addEventListener('storage', e => { if (e.key === KEY) { load(); fire(); } });
  const cl = v => v === undefined ? undefined : JSON.parse(JSON.stringify(v));
  const snap = p => ({ id: p.split('/').pop(), exists: Object.prototype.hasOwnProperty.call(st, p), data: () => cl(st[p]), metadata:{} });
  const cmp = (a, op, b) => op==='==' ? a===b : op==='!=' ? a!==b : op==='<' ? a<b : op==='<=' ? a<=b : op==='>' ? a>b : op==='>=' ? a>=b : op==='in' ? (b||[]).includes(a) : op==='array-contains' ? (a||[]).includes(b) : false;
  const merge = (t, s) => { Object.keys(s).forEach(k => { const v = s[k]; if (v && typeof v==='object' && !Array.isArray(v) && t[k] && typeof t[k]==='object' && !Array.isArray(t[k])) merge(t[k], v); else t[k] = cl(v); }); return t; };
  const docRef = p => ({ id: p.split('/').pop(), path: p,
    get: async () => snap(p),
    set: async d => { st[p] = cl(d); persist(); },
    update: async d => { if (!st[p]) throw {code:'invalid_argument', message:'missing'}; merge(st[p], d); persist(); },
    delete: async () => { delete st[p]; persist(); },
    onSnapshot(n){ const f = () => n(snap(p)); subs.add(f); setTimeout(f, 0); return () => subs.delete(f); },
    collection: c => colRef(p + '/' + c) });
  const colRef = (c, f = [], ob = null, lim = 0) => {
    const run = () => { const depth = c.split('/').length + 1;
      let docs = Object.keys(st).filter(k => k.startsWith(c + '/') && k.split('/').length === depth).map(snap).filter(s => f.every(([fl, op, v]) => cmp((s.data()||{})[fl], op, v)));
      if (ob) docs.sort((a, b) => { const x = (a.data()||{})[ob[0]], y = (b.data()||{})[ob[0]]; return (x > y ? 1 : x < y ? -1 : 0) * (ob[1]==='desc' ? -1 : 1); });
      if (lim) docs = docs.slice(0, lim);
      return { docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata:{} }; };
    return { path: c,
      where: (fl, op, v) => colRef(c, [...f, [fl, op, v]], ob, lim), orderBy: (fl, dir) => colRef(c, f, [fl, dir||'asc'], lim), limit: n => colRef(c, f, ob, n),
      get: async () => run(),
      onSnapshot(n){ const g = () => n(run()); subs.add(g); setTimeout(g, 0); return () => subs.delete(g); },
      doc: id => docRef(c + '/' + (id || Date.now().toString(36) + Math.random().toString(36).slice(2, 7))),
      add: async d => { const r = docRef(c + '/' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7)); await r.set(d); return r; } };
  };
  return { doc: docRef, collection: c => colRef(c) };
}

async function ensureAuth(){

async function withAuthRetry(fn){

async function submitFeedback(){
  const f = draft.fb; const c = document.getElementById('fbcomment'); if (c) f.comment = c.value.trim().slice(0,1200);
  const cb = document.getElementById('fbcall'); if (cb) f.callback = cb.checked;
  const doc = {stayId:S.id, room:S.room, guestName:S.guestName, overall:f.overall, cats:f.cats, loves:f.loves, comment:f.comment, callback:!!f.callback, at:Date.now(), afterCheckout:!!view.farewell, route: f.overall>=4 ? 'google' : 'manager'};
  try {
    await db.doc('feedback/'+S.id).set(doc);
    await db.doc('stays/'+S.id).update({feedbackAt:Date.now(), feedbackScore:f.overall}).catch(()=>{});
    if (f.overall <= 3) {
      const id = 'FD-' + Date.now().toString(36).toUpperCase().slice(-5);
      await db.doc('requests/'+id).set({stayId:S.id, room:S.room, guestName:S.guestName, kind:'feedback', dept:'Front Office', status: view.farewell ? 'received' : 'received', receivedAt:Date.now(), acceptedAt:null, completedAt:null, rating:null,
        items:[{name:`Stay rated ${f.overall}/5`, qty:1}, ...Object.entries(f.cats).filter(([,v])=>v&&v<=3).map(([k,v])=>({name:`${k} ${v}/5`, qty:1}))], note: f.comment || '', title:'Low stay rating', when: f.callback ? 'Guest asked for a call' : '', total:0, targetMin:10, afterCheckout: !!view.farewell});
    }
    view = {kind:'feedback', farewell:view.farewell, sent:{overall:f.overall, comment:f.comment, callback:f.callback}}; render();
  } catch(e){ toast('Feedback not sent. Check the connection and try again.'); }
}

function captureInputs(){
  const g = id => document.getElementById(id);
  if (g('note')) draft.note = g('note').value;
  ['sday','tday','oday','wday'].forEach(id => { if (g(id)) draft.day = g(id).value; });
  if (g('sslot')) draft.slot = g('sslot').value;
  ['ttime','otime','wtime'].forEach(id => { if (g(id)) draft.time = g(id).value; });
  if (g('lexp')) draft.express = g('lexp').checked;
  if (g('wtea')) draft.tea = g('wtea').checked;
}
$app.addEventListener('click', async e => {
  const b = e.target.closest('button,[data-open]'); if (!b || !S) return;
  const d = b.dataset;
  if (d.tab){ tab = d.tab; view = null; store.set('sb_tab', tab); window.scrollTo(0,0); render(); return; }
  if (d.act==='logout'){ logout(); return; }
  if (d.act==='close'){ view = null; draft = {}; render(); return; }
  if (d.fb){ draft = {}; view = {kind:'feedback'}; window.scrollTo(0,0); render(); return; }
  if (d.fbstar){ const fb = draft.fb; const c = document.getElementById('fbcomment'); if (c) fb.comment = c.value; const n = Number(d.n); if (d.fbstar==='overall') fb.overall = n; else fb.cats[d.fbstar] = fb.cats[d.fbstar]===n ? 0 : n; render(); return; }
  if (d.fblove){ const fb = draft.fb; const c = document.getElementById('fbcomment'); if (c) fb.comment = c.value; fb.loves = fb.loves.includes(d.fblove) ? fb.loves.filter(x=>x!==d.fblove) : [...fb.loves, d.fblove]; render(); return; }
  if (d.fbsubmit){ b.disabled = true; await submitFeedback(); return; }
  if (d.fbcopy){ try { await navigator.clipboard.writeText(view.sent.comment); toast('Copied. Paste it into your Google review.'); } catch(err){ toast('Copy is blocked here. Please retype it on Google.'); } return; }
  if (d.fbdone){ if (view.farewell) { logout('Thank you for staying with us. We hope to welcome you back.'); } else { view = null; draft = {}; render(); } return; }
  if (d.svc){ draft = {}; view = {kind:d.svc, svcId:d.svcid}; window.scrollTo(0,0); render(); return; }
  if (d.open){ view = {kind:'req', id:d.open}; window.scrollTo(0,0); render(); return; }
  if (d.acc){ captureInputs(); draft.open = draft.open===d.acc ? null : d.acc; render(); return; }
  if (d.step){ captureInputs(); const q = sel(); const n = Math.max(0,(q[d.step]||0)+Number(d.d)); q[d.step]=n; render(); return; }
  if (d.lsvc){ captureInputs(); draft.svc = d.lsvc; draft.q = {}; render(); return; }
  if (d.issue){ captureInputs(); const on = draft.issues||[]; draft.issues = on.includes(d.issue) ? on.filter(x=>x!==d.issue) : [...on, d.issue]; render(); return; }
  if (d.gcat){ draft.gcat = d.gcat; render(); return; }
  if (d.cab){ draft = {pick: L('taxi').findIndex(t=>/Amer/.test(t.name)), note:'Going to: '+d.cab}; if (draft.pick<0) delete draft.pick; view = {kind:'taxi'}; window.scrollTo(0,0); render(); return; }
  if (d.offer){ logOffer(d.offer,'tappedAt'); draft = {}; view = {kind:'offer', code:d.offer}; window.scrollTo(0,0); render(); return; }
  if (d.copy){ try { await navigator.clipboard.writeText(d.copy); toast('Copied'); } catch(err){ const r=document.createRange(); const el=document.getElementById('wpass'); if(el){r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} toast('Select and copy: '+d.copy); } return; }
  if (d.rate){ const r = requests.find(x=>x.id===view.id); if (r) { try { await db.doc('requests/'+r.id).update({rating:Number(d.rate), ratedAt:Date.now()}); toast('Thank you for the feedback'); } catch(err){ toast('Rating not saved. Try again.'); } } return; }
  if (d.submit){ captureInputs(); b.disabled = true; await doSubmit(d.submit); return; }
});
$app.addEventListener('change', e => {

async function doSubmit(kind){
  const q = draft.q || {}; const note = (draft.note||'').trim().slice(0,500);
  if (kind==='housekeeping'){ const items = L('hk').filter(i=>q[i.name]>0).map(i=>({name:i.name, qty:q[i.name]}));
    return submitRequest(kind,{items, note, title:'Housekeeping', targetMin: items.some(i=>/cleaning|Turn-down/.test(i.name))?20:15}); }
  if (kind==='dining'){ const items = L('dining').filter(i=>q[i.name]>0).map(i=>({name:i.name, qty:q[i.name], price:i.price}));
    return submitRequest(kind,{items, note, total: items.reduce((a,i)=>a+i.price*i.qty,0), title:'In-room dining', targetMin:30}); }
  if (kind==='spa'){ const t = L('spa')[draft.pick]; const p = spaPrice(t);
    return submitRequest(kind,{items:[{name:t.name, qty:1, price:p.price}], note, total:p.price, when:`${draft.day||'Today'} ${slotLabel(draft.slot)}`, title:t.name, offer:p.code, targetMin:10}); }
  if (kind==='laundry'){ const col={wash:'Wash & iron',iron:'Iron only',dry:'Dry clean'}; const items = L('laundry').filter(l=>q[l.name]>0).map(l=>({name:l.name, qty:q[l.name], price:l[draft.svc]}));
    const sub = items.reduce((a,i)=>a+i.price*i.qty,0); return submitRequest(kind,{items, note, total: draft.express?Math.round(sub*1.5):sub, title:col[draft.svc]+(draft.express?' · express':''), when: col[draft.svc]+(draft.express?' · same-day express':''), targetMin:20}); }
  if (kind==='taxi'){ const t = L('taxi')[draft.pick];
    return submitRequest(kind,{items:[{name:t.name+' · '+t.car, qty:1, price:t.fare}], note, total:t.fare, when:`${draft.day||'Today'} ${draft.time}`, title:t.name, targetMin:10}); }
  if (kind==='occasion'){ const o = L('occ')[draft.pick];
    return submitRequest(kind,{items:[{name:o.name, qty:1, price:o.price}], note, total:o.price, when:`${draft.day||'Today'}${draft.time?' '+draft.time:''}`, title:o.name, targetMin:10}); }
  if (kind==='maintenance'){ return submitRequest(kind,{items:(draft.issues||[]).map(x=>({name:x, qty:1})), note, title:'Maintenance', targetMin:30}); }
  if (kind==='wakeup'){ const items=[{name:`Wake-up call · ${draft.day||'Tomorrow'} ${draft.time||'07:00'}`, qty:1}]; if (draft.tea) items.push({name:'Masala chai', qty:1, price:90});
    return submitRequest(kind,{items, total: draft.tea?90:0, when:`${draft.day||'Tomorrow'} ${draft.time||'07:00'}`, title:'Wake-up call', targetMin:5}); }
  if (kind==='custom'){ const sv = (DATA.services||[]).find(v=>v.id===view.svcId) || {};
    const opts = String(sv.options||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{ const [n,pr] = l.split('|').map(x=>x.trim()); return {name:n, price:Number(pr)||0}; });
    const items = opts.filter(o=>q[o.name]>0).map(o=>({name:o.name, qty:q[o.name], price:o.price}));
    return submitRequest('custom',{items, note, total: items.reduce((a,i)=>a+i.price*i.qty,0), title: sv.label||'Request', dept: sv.dept||'Front Office', targetMin:15}); }
  if (kind==='offer'){ const o = L('offers').find(x=>x.code===view.code);
    return submitRequest(kind,{items:[{name:o.title, qty:1, price:Number(o.value)||0}], total:Number(o.value)||0, note, when:`${draft.day||'Today'}${draft.time?' '+draft.time:''}`, title:o.title, offer:o.code, dept:o.dept==='Spa'?'Spa':o.dept==='F&B'?'F&B':'Front Office', targetMin:10}); }
}

function chime(){
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const t = audioCtx.currentTime;
    [[880,0],[1175,0.18],[880,0.5],[1175,0.68]].forEach(([f,d]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t+d); g.gain.exponentialRampToValueAtTime(0.35, t+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, t+d+0.16);
      o.start(t+d); o.stop(t+d+0.18);
    });
  } catch(e){}
}

const mins = (a,b) => Math.max(0, Math.round((b-a)/60000));
const isToday = ms => ms && new Date(ms).toDateString() === new Date().toDateString();
const overdue = r => r.status==='received' && Date.now() - r.receivedAt > ACCEPT_MIN*60000;
const late = r => r.status==='accepted' && Date.now() - r.receivedAt > (r.targetMin||15)*60000;

      ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
      <button class="btn" type="submit" id="sbtn">Open console with sound</button>
      <div style="font-size:13px;color:var(--muted);text-align:center">Keep this screen open at the desk. New requests ring and pop up.</div>
    </form>
    ${MODE==='local'?'<div class="demo" style="max-width:420px"><b>Demo mode.</b> Data stays in this browser. Open guest and staff in two tabs of the same browser to try it.</div>':''}
    <div style="display:flex;gap:18px"><button class="linkbtn" id="toguest" style="font-size:13px">Guest log in</button><button class="linkbtn" id="toadmin" style="font-size:13px">Admin console</button></div>
  </div>`;
  document.getElementById('toadmin').onclick = () => { history.replaceState(null,'','#admin'); renderAdminLogin(); };
  document.getElementById('toguest').onclick = () => { history.replaceState(null,'',location.pathname); document.body.classList.remove('staffmode'); $app.className='app'; renderLogin(); };
  document.getElementById('sf').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('sname').value.trim(); const dept = document.getElementById('sdept').value; const pin = document.getElementById('spin').value.trim();
    if (!name || !pin) return renderStaffLogin('Enter your name and the staff PIN.');
    if (!db) return renderStaffLogin('Live service is not connected on this view. Open the concierge link on claude.ai.');
    try {
      const s = await db.doc('settings/staff').get();
      if (!s.exists) return renderStaffLogin('The staff PIN is not set yet. Ask the admin to open the link with #admin and finish setup.');
      const ok = s.exists && s.data().pinHash === await sha('sb-staff|' + pin);
      if (!ok) return renderStaffLogin('That PIN is not right. Ask the duty manager.');
    } catch(err){ return renderStaffLogin('We couldn’t reach the console just now. Try again.'); }
    soundOn = true; chime();                               // the tap unlocks audio
    store.set('sb_sname', name); store.set('sb_sdept', dept); store.set('sb_staff', {name, dept});
    startStaff({name, dept});
  });
}

function startStaff(st){
  ST = st; sFilter = st.dept; sFirst = true; sSeen.clear();
  document.body.classList.add('staffmode'); $app.className = 'app staff';
  sUnsubs.forEach(u=>u()); sUnsubs = [];
  sLoaded = false;
  sUnsubs.push(live(db.collection('requests').where('receivedAt','>=',since(60)), q => {
    sReq = q.docs.map(d=>({id:d.id,...d.data()})); sLoaded = true; sweep(sStays, sReq, sStaysOk);
    const fresh = sReq.filter(r => !sSeen.has(r.id));
    fresh.forEach(r => sSeen.add(r.id));
    if (!sFirst) { const mine = fresh.filter(r => r.status==='received' && (ST.dept==='All' || r.dept===ST.dept)); if (mine.length){ sAlert = mine[mine.length-1].id; chime(); } }
    sFirst = false; soon(renderStaff);
  }, 'staff requests'));
  let firstMsg = true;
  sUnsubs.push(live(db.collection('messages').where('at','>=',since(30)), q => {
    const before = new Set(sMsg.map(m=>m.id));
    sMsg = q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.at-b.at);
    if (!firstMsg && sMsg.some(m => !before.has(m.id) && m.from==='guest')) { chime(); if (!(sTab==='chats' && sRoom)) toastS('New guest message'); }
    firstMsg = false; markRead(); soon(renderStaff);
  }, 'staff messages'));
  sUnsubs.push(live(db.collection('stays'), q => { sStays = q.docs.map(d=>({id:d.id,...d.data()})); sStaysOk = true; sweep(sStays, sReq, sLoaded); soon(renderStaff); }, 'staff stays'));
  clearInterval(sTimer); sTimer = setInterval(() => { sweep(sStays, sReq, sLoaded && sStaysOk); renderStaff(); if (sReq.some(r => overdue(r) && (ST.dept==='All'||r.dept===ST.dept||ST.dept==='Front Office'))) { if (Math.floor(Date.now()/1000)%60 < 30) chime(); } }, 30000);
  renderStaff();
}
function toastS(m){ toast(m); }
function staffLogout(){ sUnsubs.forEach(u=>u()); sUnsubs=[]; clearInterval(sTimer); ST=null; store.del('sb_staff'); renderStaffLogin(); }
markRead.done = new Set();
function markRead(){
  if (!ST || sTab!=='chats' || !sRoom) return;
  sMsg.filter(m => m.stayId===sRoom && m.from==='guest' && !m.read && !markRead.done.has(m.id)).forEach(m => { markRead.done.add(m.id); db.doc('messages/'+m.id).update({read:true}).catch(()=>{}); });
}

  const act = st==='received' ? `<button class="btn sm" data-sacc="${esc(r.id)}">Accept</button>`
            : st==='accepted' ? `<button class="btn sm" data-sdone="${esc(r.id)}">Mark completed</button>` : '';
  return `<article class="card scard ${od?'od':''}">
    <div class="shead"><div><div class="sroom">Room ${esc(r.room)} · ${esc(r.guestName||stay?.guestName||'')}</div><div class="sub">${esc(kl(r))} · #${esc(r.id)} · ${esc(r.dept)}</div></div>

    <div class="stimes">Received ${tfmt(r.receivedAt)} (${ago(r.receivedAt)})${r.acceptedAt?` · Accepted ${tfmt(r.acceptedAt)} by ${esc(r.acceptedBy||'staff')} in ${mins(r.receivedAt,r.acceptedAt)} min`:''}${r.completedAt?` · Done ${tfmt(r.completedAt)} · ${mins(r.receivedAt,r.completedAt)} min total`:''}${r.rating?` · Guest rating ${'★'.repeat(r.rating)}`:''}</div>

async function staffReply(text){

  const st = sStays.find(s=>s.id===sRoom); const any = sMsg.find(m=>m.stayId===sRoom);
  try { await db.collection('messages').add({stayId:sRoom, room: st?.room || any?.room || '', guestName: st?.guestName || any?.guestName || '', from:'staff', staffName: ST.name, text:text.slice(0,600), at:Date.now(), read:true}); }
  catch(e){ toast('Reply not sent. Try again.'); }
}

const atTime = (days, h, m) => { const d = new Date(); d.setDate(d.getDate()+days); d.setHours(h,m,0,0); return d.getTime(); };
function guestLink(room){ const base = (SETTINGS.guestUrl || '').split('#')[0]; return base ? `${base}#r${room}` : `#r${room}`; }

function renderSetup(err){
  document.body.classList.add('staffmode'); $app.className = 'app staff';
  $app.innerHTML = `<div class="login">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">${logo(160,'#FFF8EB')}<div style="font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)">First-time setup</div></div>
    <form class="card" id="setupf" novalidate style="max-width:440px">
      <div style="font-family:var(--display);font-size:20px;font-weight:500;color:var(--deep)">Set up the concierge</div>
      <div class="sub">This runs once. Choose the PINs your team will use. Menus, offers and the Jaipur guide are already loaded from your content pack and can be edited later in the admin console.</div>
      <label class="field" for="su-admin">Admin PIN (4–8 digits)<input id="su-admin" type="password" inputmode="numeric" autocomplete="off"></label>
      <label class="field" for="su-staff">Staff PIN (4–8 digits)<input id="su-staff" type="password" inputmode="numeric" autocomplete="off"></label>
      <label class="field" for="su-url">Guest link printed on QR cards<input id="su-url" value="${esc(location.origin + location.pathname)}"></label>
      ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
      <button class="btn" type="submit">Finish setup</button>
    </form>
    ${MODE==='local'?'<div class="demo" style="max-width:440px"><b>Demo mode.</b> No Firebase settings found, so everything is saved in this browser only. Fine for a trial on one device.</div>':''}
  </div>`;
  document.getElementById('setupf').addEventListener('submit', async e => {
    e.preventDefault();
    const ap = document.getElementById('su-admin').value.trim(), sp = document.getElementById('su-staff').value.trim(), url = document.getElementById('su-url').value.trim();
    if (!/^\d{4,8}$/.test(ap) || !/^\d{4,8}$/.test(sp)) return renderSetup('Both PINs need 4 to 8 digits.');
    try {
      const ex = await db.doc('settings/admin').get(); if (ex.exists) return renderAdminLogin('Setup was already completed. Log in with the admin PIN.');
      await db.doc('settings/admin').set({pinHash: await sha('sb-admin|'+ap)});
      await db.doc('settings/staff').set({pinHash: await sha('sb-staff|'+sp)});
      await db.doc('settings/app').set(Object.assign({}, SETTINGS, {guestUrl: url, setupAt: Date.now()}));
      toast('Setup complete. Log in with your admin PIN.'); renderAdminLogin();
    } catch(err){ renderSetup('Could not save. Check the Firebase settings and security rules, then try again.'); }
  });
}
function renderAdminLogin(err){
  if (db && !err && !renderAdminLogin.checked) { renderAdminLogin.checked = true; db.doc('settings/admin').get().then(x => { if (!x.exists && !AD) renderSetup(); }).catch(()=>{}); }
  document.body.classList.add('staffmode'); $app.className = 'app staff';
  $app.innerHTML = `<div class="login">
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">${logo(160,'#FFF8EB')}<div style="font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--soft)">Sisodia Bagh · Admin</div></div>
    <form class="card" id="af" novalidate style="max-width:420px">
      <div style="font-family:var(--display);font-size:20px;font-weight:500;color:var(--deep)">Admin &amp; front desk</div>
      <label class="field" for="aname">Your name<input id="aname" autocomplete="off" value="${esc(store.get('sb_aname')||'')}"></label>
      <label class="field" for="apin">Admin PIN<input id="apin" type="password" inputmode="numeric" autocomplete="off" placeholder="4-digit PIN"></label>
      ${err?`<div class="err" role="alert">${esc(err)}</div>`:''}
      <button class="btn" type="submit">Open admin console</button>
    </form>
    ${MODE==='local'?'<div class="demo" style="max-width:420px"><b>Demo mode.</b> No database connected; data stays in this browser.</div>':''}
    <button class="linkbtn" id="aback" style="font-size:13px">Back to guest log in</button>
  </div>`;
  document.getElementById('aback').onclick = () => { history.replaceState(null,'',location.pathname); document.body.classList.remove('staffmode'); $app.className='app'; renderLogin(); };
  document.getElementById('af').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('aname').value.trim(), pin = document.getElementById('apin').value.trim();
    if (!name || !pin) return renderAdminLogin('Enter your name and the admin PIN.');
    if (!db) return renderAdminLogin('Live service is not connected on this view. Open the concierge link on claude.ai.');
    try { const s = await db.doc('settings/admin').get(); if (!(s.exists && s.data().pinHash === await sha('sb-admin|'+pin))) return renderAdminLogin('That PIN is not right.'); }
    catch(err){ return renderAdminLogin('We couldn’t reach the console just now. Try again.'); }
    store.set('sb_aname', name); store.set('sb_admin', {name}); startAdmin({name});
  });
}
function startAdmin(a){
  AD = a; document.body.classList.add('staffmode'); $app.className = 'app staff';
  aUnsubs.forEach(u=>u()); aUnsubs = [];
  const aRefresh = secs => { if (!secs || secs.includes(aSec)) { if (!typing()) soon(renderAdmin); } };
  aUnsubs.push(live(db.collection('stays'), q => { aStays = q.docs.map(d=>({id:d.id,...d.data()})); aStaysOk = true; sweep(aStays, aReq, aStaysOk && aReqOk); aRefresh(['stays','dashboard']); }, 'admin stays'));
  aUnsubs.push(live(db.collection('requests').where('receivedAt','>=',since(62)), q => { aReq = q.docs.map(d=>({id:d.id,...d.data()})); aReqOk = true; sweep(aStays, aReq, aStaysOk && aReqOk); aRefresh(['stays','dashboard']); }, 'admin requests'));
  aUnsubs.push(live(db.collection('feedback'), q => { aFb = q.docs.map(d=>({id:d.id,...d.data()})); aRefresh(['stays','dashboard']); }, 'admin feedback'));
  aUnsubs.push(live(db.collection('offerEvents'), q => { aOffers = q.docs.map(d=>({id:d.id,...d.data()})); aRefresh(['dashboard']); }, 'admin offers'));
  clearInterval(window.__aTimer); window.__aTimer = setInterval(() => { sweep(aStays, aReq, aStaysOk && aReqOk); aRefresh(['stays','dashboard']); }, 60000);
  connectDownloads().then(d => { downloads = d; });
  renderAdmin();
}
function adminLogout(){ aUnsubs.forEach(u=>u()); aUnsubs=[]; AD=null; store.del('sb_admin'); renderAdminLogin(); }

function draftOf(sec){
  if (!aDraft[sec]) aDraft[sec] = clone(sec==='prop' ? DATA.prop : (DATA[listKey(sec)] || []));
  return aDraft[sec];
}
function fieldInput(sec, i, f){
  const [k, label, type, a3, a4, names] = f; const span = Array.isArray(a3) ? null : a3; const opts = Array.isArray(a3) ? a3 : a4; const row = draftOf(sec)[i]; const v = row[k]; const id = `f-${sec}-${i}-${k}`;
  const common = `id="${id}" data-asec="${sec}" data-ai="${i}" data-ak="${k}" data-at="${type}"`;
  if (type==='bool') return `<label class="abool" for="${id}"><input type="checkbox" ${common} ${v!==false&&v?'checked':''}> ${esc(label)}</label>`;
  let inp;
  if (type==='select') inp = `<select ${common}>${opts.map(o=>`<option value="${esc(o)}" ${String(v)===String(o)?'selected':''}>${esc(names?names[o]:o)}</option>`).join('')}</select>`;
  else if (type==='textarea') inp = `<textarea ${common} rows="3">${esc(v)}</textarea>`;
  else inp = `<input ${common} type="${type==='number'?'number':'text'}" value="${esc(v ?? '')}" ${type==='number'?'inputmode="decimal"':''}>`;
  return `<label class="field af ${span?'s'+span:''}" for="${id}">${esc(label)}${inp}</label>`;
}

    ${rows.length>3?`<div class="abar" style="justify-content:flex-end"><button class="btn sm ghost" data-aadd="${sec}">+ Add</button><button class="btn sm" data-asave="${sec}" ${dirty?'':'disabled'}>${dirty?'Save & publish':'Saved'}</button></div>`:''}`;

  if (e.target.id==='pinform'){ e.preventDefault(); const sp = document.getElementById('pin-staff').value.trim(), ap = document.getElementById('pin-admin').value.trim();

});


/* =================================================================
   MANAGEMENT DASHBOARD (Step 6) — inside the admin console
   ================================================================= */
let dRange = 'week', aOffers = [], aFb = [];
const KPI_DEFAULTS = {googlePct:15, acceptMin:3, hkMin:15, fbMin:30, mtMin:30, adoption:70, convPct:10, upsellPerNight:800, rating:4.5};
const K = () => Object.assign({}, KPI_DEFAULTS, SETTINGS);
const avg = a => a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
const pct = (a,b) => b ? Math.round(a*100/b) : null;
const fmt1 = v => v===null || isNaN(v) ? '–' : (Math.round(v*10)/10).toString();
function rangeStart(){ const d = new Date(); d.setHours(0,0,0,0); if (dRange==='today') return d.getTime(); if (dRange==='week') return d.getTime()-6*864e5; if (dRange==='month') return d.getTime()-29*864e5; return 0; }
function shiftOf(ms){ const h = new Date(ms).getHours(); return h>=7&&h<15 ? 'Morning 7 AM–3 PM' : h>=15&&h<23 ? 'Evening 3–11 PM' : 'Night 11 PM–7 AM'; }
function tile(label, value, unit, target, good, note){
  const st = good===null ? '' : good ? '<span class="kst ok">✓ On target</span>' : '<span class="kst bad">! Below target</span>';
  return `<div class="card ktile"><div class="eyebrow">${label}</div><div class="kv">${value}<small>${unit||''}</small></div><div class="kfoot">${st}<span>${target?`Target ${target}`:''}${note?` · ${note}`:''}</span></div></div>`;
}
function hbars(rows, unit, fmtV){  // rows: [{label, v, sub}]
  const max = Math.max(1, ...rows.map(r=>r.v||0));
  return `<div class="hbars">${rows.map(r=>`<div class="hb" title="${esc(r.label)}: ${fmtV?fmtV(r.v):r.v}${unit||''}${r.sub?' · '+esc(r.sub):''}"><span class="hl">${esc(r.label)}</span><span class="ht"><i style="width:${Math.max(2,(r.v||0)/max*100)}%"></i></span><span class="hv">${fmtV?fmtV(r.v):r.v}${unit||''}${r.sub?`<small>${esc(r.sub)}</small>`:''}</span></div>`).join('')}</div>`;
}
function columns(vals, labels, title){  // single-series column chart, SVG
  const W = 640, H = 200, pl = 28, pb = 26, pt = 10, n = vals.length, max = Math.max(1, ...vals);
  const step = Math.ceil(max/4) || 1, top = step*4; const bw = (W-pl-8)/n;
  const y = v => pt + (H-pt-pb) * (1 - v/top);
  let g = '';
  for (let i=0;i<=4;i++){ const v = step*i; g += `<line x1="${pl}" x2="${W-4}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" class="ax">${v}</text>`; }
  const bars = vals.map((v,i)=>{ const x = pl + i*bw + bw*0.15, w = Math.max(2, bw*0.7), yy = y(v), h = (H-pb) - yy;
    return `<g class="col"><rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"><title>${esc(labels[i])}: ${v}</title></rect>${v?`<path d="M${x},${H-pb} V${yy+Math.min(4,h)} Q${x},${yy} ${x+Math.min(4,w/2)},${yy} H${x+w-Math.min(4,w/2)} Q${x+w},${yy} ${x+w},${yy+Math.min(4,h)} V${H-pb} Z" class="bar"><title>${esc(labels[i])}: ${v}</title></path>`:''}</g>`; }).join('');
  const every = Math.ceil(n/12);
  const lab = labels.map((l,i)=> i%every===0 ? `<text x="${pl+i*bw+bw/2}" y="${H-8}" text-anchor="middle" class="ax">${esc(l)}</text>` : '').join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="colchart" role="img" aria-label="${esc(title)}">${g}${bars}<line x1="${pl}" x2="${W-4}" y1="${H-pb}" y2="${H-pb}" class="base"/>${lab}</svg>`;
}
function dashView(){
  const k = K(); const from = rangeStart();
  const inRange = r => r.receivedAt >= from;
  const R = aReq.filter(inRange);
  const acted = R.filter(r=>r.acceptedAt);
  const accMins = acted.map(r=>(r.acceptedAt-r.receivedAt)/60000);
  const done = R.filter(r=>r.status==='completed' && r.completedAt);
  const compMins = done.map(r=>(r.completedAt-r.receivedAt)/60000);
  const withinAcc = acted.filter(r=>(r.acceptedAt-r.receivedAt)/60000 <= k.acceptMin).length;
  const missed = R.filter(r=>r.status==='closed').length;
  const open = R.filter(r=>r.status==='received'||r.status==='accepted').length;
  const rated = R.filter(r=>r.rating);
  const FB = aFb.filter(f=>f.at>=from); const fbAvg = avg(FB.map(f=>f.overall));
  const avgRating = fbAvg!==null ? fbAvg : avg(rated.map(r=>r.rating));
  const outIn = aStays.filter(x=>x.status==='checked-out' && (x.checkedOutAt||x.checkOut||0)>=from).length;
  const outIds = new Set(aStays.filter(x=>x.status==='checked-out').map(x=>x.id));
  const FBout = FB.filter(f=>outIds.has(f.stayId));
  const gTaps = FB.filter(f=>f.googleTappedAt).length;
  const revenueReqs = R.filter(r=>(r.total||0)>0 && r.status!=='closed');
  const revenue = revenueReqs.reduce((a,r)=>a+(r.total||0),0);
  // occupied room-nights in range
  const now = Date.now(); let nightsF = 0;
  aStays.forEach(s => { const a = Math.max(s.checkIn||0, from), b = Math.min(s.checkedOutAt || s.checkOut || now, now); if (b > a) nightsF += (b-a)/864e5; });
  const nights = Math.round(nightsF*10)/10;
  const stayIn = aStays.filter(s => (s.checkIn||0) >= from || ((s.checkedOutAt||s.checkOut||now) >= from));
  const usedApp = new Set([...aReq.map(r=>r.stayId), ...aOffers.map(o=>o.stayId)]);
  const loggedIn = stayIn.filter(s=>s.firstLoginAt || usedApp.has(s.id)).length;
  const perNight = nightsF >= 0.5 ? revenue/nightsF : null;
  // offers
  const OE = aOffers.filter(o => (o.viewedAt||o.tappedAt||o.bookedAt||0) >= from);
  const offerRows = (DATA.offers||[]).map(o => { const ev = OE.filter(e=>e.code===o.code); const v = ev.filter(e=>e.viewedAt).length, t = ev.filter(e=>e.tappedAt).length, bk = ev.filter(e=>e.bookedAt).length;
    const val = R.filter(r=>r.offer===o.code && r.status!=='closed').reduce((a,r)=>a+(r.total||0),0); return {o, v, t, bk, conv:pct(bk,v), val}; });
  const totV = offerRows.reduce((a,r)=>a+r.v,0), totB = offerRows.reduce((a,r)=>a+r.bk,0); const conv = pct(totB, totV);
  // departments
  const depts = DEPT_OPTS.map(d => { const x = R.filter(r=>r.dept===d); const ac = x.filter(r=>r.acceptedAt).map(r=>(r.acceptedAt-r.receivedAt)/60000); const cp = x.filter(r=>r.completedAt).map(r=>(r.completedAt-r.receivedAt)/60000);
    return {d, n:x.length, acc:avg(ac), comp:avg(cp), missed:x.filter(r=>r.status==='closed').length, open:x.filter(r=>r.status==='received'||r.status==='accepted').length}; }).filter(x=>x.n);
  const target = d => d==='Housekeeping'?k.hkMin : d==='F&B'?k.fbMin : d==='Engineering'?k.mtMin : null;
  // shifts
  const shifts = ['Morning 7 AM–3 PM','Evening 3–11 PM','Night 11 PM–7 AM'].map(s => { const x = R.filter(r=>shiftOf(r.receivedAt)===s); const ac = x.filter(r=>r.acceptedAt).map(r=>(r.acceptedAt-r.receivedAt)/60000); return {label:s, v:x.length, sub: ac.length ? `accepted in ${fmt1(avg(ac))} min avg` : 'no accepted requests'}; });
  // hourly + daily
  const hours = Array(24).fill(0); R.forEach(r => hours[new Date(r.receivedAt).getHours()]++);
  const days = dRange==='month' ? 30 : 7; const dayVals = [], dayLabels = [];
  for (let i=days-1;i>=0;i--){ const d0 = new Date(); d0.setHours(0,0,0,0); const s = d0.getTime()-i*864e5; dayVals.push(aReq.filter(r=>r.receivedAt>=s && r.receivedAt<s+864e5).length); dayLabels.push(new Date(s).toLocaleDateString('en-IN',{day:'numeric',month:'short'})); }
  // items
  const items = {}; R.filter(r=>r.kind!=='feedback').forEach(r => (r.items||[]).forEach(i => { const key = i.name; items[key] = (items[key]||0) + (i.qty||1); }));
  const topItems = Object.entries(items).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([label,v])=>({label, v}));
  // staff
  const staff = {}; R.forEach(r => { if (r.acceptedBy){ const s = staff[r.acceptedBy] || (staff[r.acceptedBy] = {n:0, m:[], c:0}); s.n++; s.m.push((r.acceptedAt-r.receivedAt)/60000); } if (r.completedBy){ (staff[r.completedBy] || (staff[r.completedBy] = {n:0, m:[], c:0})).c++; } });
  const staffRows = Object.entries(staff).sort((a,b)=>b[1].n-a[1].n);
  const low = R.filter(r=>r.rating && r.rating<=3).sort((a,b)=>b.receivedAt-a.receivedAt);
  const lowStay = FB.filter(f=>f.overall<=3).sort((a,b)=>b.at-a.at);
  const aAcc = avg(accMins);
  const rangeLbl = {today:'Today', week:'Last 7 days', month:'Last 30 days', all:'All time'}[dRange];
  return `<div class="ahead"><div><h1 class="t">Management dashboard</h1><div class="sub">${rangeLbl} · ${R.length} requests · live · targets from Settings</div></div>
    <div class="abar">${[['today','Today'],['week','7 days'],['month','30 days'],['all','All']].map(([v,l])=>`<button class="chip ${dRange===v?'on':''}" data-drange="${v}" aria-pressed="${dRange===v}">${l}</button>`).join('')}<button class="btn sm ghost" data-dcsv="1">Export CSV</button></div></div>
  ${R.length ? '' : '<div class="card note2">No requests in this period yet. Pick a longer range or send a test request from the guest app.</div>'}
  <div class="ktiles">
    ${tile('Avg. time to accept', fmt1(aAcc), ' min', `${k.acceptMin} min`, aAcc===null?null:aAcc<=k.acceptMin, `${pct(withinAcc, acted.length) ?? '–'}% within target`)}
    ${tile('Avg. time to complete', fmt1(avg(compMins)), ' min', '', null, `${done.length} completed`)}
    ${tile('Missed requests', missed, '', '0', missed===0, `${open} still open`)}
    ${tile('Guest rating', fmt1(avgRating), ' / 5', k.rating, avgRating===null?null:avgRating>=k.rating, fbAvg!==null?`${FB.length} stay reviews · ${rated.length} service ratings`:`${rated.length} service ratings`)}
    ${tile('Revenue via app', rupee(revenue), '', '', null, `${revenueReqs.length} paid requests`)}
    ${tile('Per occupied room-night', perNight===null?'–':rupee(perNight), '', rupee(k.upsellPerNight), perNight===null?null:perNight>=k.upsellPerNight, `${nights} room-nights`)}
    ${tile('Offer conversion', conv===null?'–':conv, conv===null?'':'%', `${k.convPct}%`, conv===null?null:conv>=k.convPct, `${totB} bookings / ${totV} views`)}
    ${tile('Guests using the app', pct(loggedIn, stayIn.length) ?? '–', pct(loggedIn, stayIn.length)===null?'':'%', `${k.adoption}%`, stayIn.length? pct(loggedIn, stayIn.length)>=k.adoption : null, `${loggedIn} of ${stayIn.length} stays`)}
  </div>
  <div class="dgrid">
    <div class="card"><h2 class="sh">Speed by department</h2>
      <div style="overflow-x:auto"><table class="atable dtable"><thead><tr><th>Department</th><th>Requests</th><th>Avg. accept</th><th>Avg. complete / target</th><th>Missed</th><th>Open</th></tr></thead><tbody>
      ${depts.map(x=>{ const t = target(x.d); const bad = t && x.comp!==null && x.comp>t; return `<tr><td><b>${esc(x.d)}</b></td><td>${x.n}</td><td>${fmt1(x.acc)} min ${x.acc!==null&&x.acc>k.acceptMin?'<span class="kst bad">!</span>':''}</td><td>${fmt1(x.comp)}${t?' / '+t:''} min ${bad?'<span class="kst bad">!</span>':''}</td><td>${x.missed||'–'}</td><td>${x.open||'–'}</td></tr>`; }).join('') || '<tr><td colspan="6" class="empty">No requests yet.</td></tr>'}
      </tbody></table></div></div>
    <div class="card"><h2 class="sh">Requests by shift</h2>${hbars(shifts,'')}</div>
    <div class="card"><h2 class="sh">Requests per day</h2>${columns(dayVals, dayLabels, 'Requests per day')}</div>
    <div class="card"><h2 class="sh">Busiest hours</h2>${columns(hours, hours.map((_,h)=>`${h%12||12}${h<12?'a':'p'}`), 'Requests by hour of day')}</div>
    <div class="card span2"><h2 class="sh">Offer performance</h2>
      <div style="overflow-x:auto"><table class="atable dtable"><thead><tr><th>Offer</th><th>Status</th><th>Seen by</th><th>Tapped</th><th>Booked</th><th>Conversion</th><th>Value</th></tr></thead><tbody>
      ${offerRows.map(r=>`<tr><td><b>${esc(r.o.title)}</b><br><small>${esc(r.o.code)}</small></td><td>${r.o.on===false?'<span class="pill cancelled">Off</span>':'<span class="pill completed">Live</span>'}</td><td>${r.v}</td><td>${r.t}</td><td>${r.bk}</td><td>${r.conv===null?'–':r.conv+'%'} ${r.conv!==null&&r.v>=3&&r.conv<k.convPct?'<span class="kst bad">!</span>':''}</td><td>${r.val?rupee(r.val):'–'}</td></tr>`).join('')}
      </tbody></table></div><div class="sub" style="margin-top:8px">Seen by = guests who opened the Offers tab while the offer was live. Value = booked amount, or the value per booking set in Offers.</div></div>
    <div class="card"><h2 class="sh">Most requested items</h2>${topItems.length?hbars(topItems,''):'<div class="empty">No items yet.</div>'}</div>
    <div class="card"><h2 class="sh">Team</h2>${staffRows.length?`<table class="atable dtable" style="min-width:0"><thead><tr><th>Name</th><th>Accepted</th><th>Avg. accept</th><th>Completed</th></tr></thead><tbody>${staffRows.map(([n,s])=>`<tr><td><b>${esc(n)}</b></td><td>${s.n}</td><td>${fmt1(avg(s.m))} min</td><td>${s.c}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">Staff names appear once requests are accepted.</div>'}</div>
    <div class="card span2"><h2 class="sh">Stay feedback <span>${FB.length} reviews · ${FBout.length} of ${outIn} check-outs left feedback</span></h2>
      <div class="dgrid" style="margin-top:6px">
        <div>${hbars([5,4,3,2,1].map(n=>({label:'★'.repeat(n), v:FB.filter(f=>f.overall===n).length})),'')}</div>
        <div>${hbars(FB_CATS.map(c=>{ const v = avg(FB.map(f=>f.cats&&f.cats[c]).filter(Boolean)); return {label:c, v: v===null?0:Math.round(v*10)/10}; }),'', v => v ? v+' / 5' : '–')}</div>
      </div>
      <div class="ktiles" style="margin-top:12px">
        ${tile('Feedback rate', pct(FBout.length, outIn) ?? '–', pct(FBout.length,outIn)===null?'':'%', '', null, `of check-outs · ${FB.length-FBout.length} during stay`)}
        ${tile('Google review taps', gTaps, '', `${Math.round(k.googlePct)}% of check-outs`, outIn? pct(gTaps,outIn)>=k.googlePct : null, `${pct(gTaps,outIn) ?? '–'}% of check-outs`)}
        ${tile('Needs recovery', FB.filter(f=>f.overall<=3).length, '', '', null, `${FB.filter(f=>f.callback).length} asked for a call`)}
        ${tile('Top love', (()=>{ const c={}; FB.forEach(f=>(f.loves||[]).forEach(l=>c[l]=(c[l]||0)+1)); const t=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return t?esc(t[0]):'–'; })(), '', '', null, 'most-picked highlight')}
      </div>
      ${FB.filter(f=>f.comment).length?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px">${FB.filter(f=>f.comment).sort((a,b)=>b.at-a.at).slice(0,8).map(f=>`<div class="fbq ${f.overall<=3?'low':''}"><b>${'★'.repeat(f.overall)}</b> “${esc(f.comment)}” <span class="sub">— Room ${esc(f.room)} · ${esc(f.guestName)} · ${fmtDT(f.at)}${f.googleTappedAt?' · opened Google':''}</span></div>`).join('')}</div>`:''}
    </div>
    <div class="card span2"><h2 class="sh">Low ratings to follow up <span>${low.length+lowStay.length}</span></h2>${lowStay.length?`<table class="atable dtable"><tbody>${lowStay.map(f=>{ const rq = aReq.find(r=>r.kind==='feedback'&&r.stayId===f.stayId); return `<tr><td><b>Room ${esc(f.room)}</b> · ${esc(f.guestName||'')}</td><td>Whole stay${f.callback?' · asked for a call':''}</td><td>${'★'.repeat(f.overall)}${'☆'.repeat(5-f.overall)}</td><td>${f.comment?`“${esc(f.comment.slice(0,80))}”`:''}</td><td>${rq?(rq.status==='completed'?`<span class="pill completed">Recovered by ${esc(rq.completedBy||'staff')}</span>`:rq.status==='accepted'?'<span class="pill accepted">In progress</span>':'<span class="pill received">Not yet contacted</span>'):''}</td></tr>`; }).join('')}</tbody></table>`:''}${low.length?`<table class="atable dtable"><tbody>${low.map(r=>`<tr><td><b>Room ${esc(r.room)}</b> · ${esc(r.guestName||'')}</td><td>${esc(kl(r))} · #${esc(r.id)}</td><td>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</td><td>${fmtDT(r.receivedAt)}</td><td>${r.acceptedAt?`accepted in ${fmt1((r.acceptedAt-r.receivedAt)/60000)} min`:'not accepted'}</td></tr>`).join('')}</tbody></table>`:(lowStay.length?'':'<div class="empty">No ratings of 3 stars or below in this period.</div>')}</div>
  </div>`;
}
function requestsCsv(){
  const cols = ['id','room','guestName','kind','dept','title','items','total','offer','status','received','accepted','completed','minsToAccept','minsToComplete','acceptedBy','completedBy','rating'];
  const t = ms => ms ? new Date(ms).toLocaleString('en-IN') : '';
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const rows = aReq.filter(r=>r.receivedAt>=rangeStart()).sort((a,b)=>a.receivedAt-b.receivedAt).map(r => [r.id, r.room, r.guestName, r.kind, r.dept, kl(r), (r.items||[]).map(i=>`${i.name} x${i.qty||1}`).join('; '), r.total||0, r.offer||'', r.status, t(r.receivedAt), t(r.acceptedAt), t(r.completedAt), r.acceptedAt?fmt1((r.acceptedAt-r.receivedAt)/60000):'', r.completedAt?fmt1((r.completedAt-r.receivedAt)/60000):'', r.acceptedBy||'', r.completedBy||'', r.rating||''].map(q).join(','));
  return [cols.join(','), ...rows].join('\n');
}

/* ---------- BOOT ---------- */
const staffEntry = location.hash === '#staff';
const adminEntry = location.hash === '#admin';
window.addEventListener('hashchange', () => location.reload());
$app.innerHTML = '<div class="login"><div style="margin:auto;color:var(--soft);font-size:14px">Loading concierge…</div></div>';
(async () => {
  try { db = await connectDb(); } catch(e){ db = localDb(); MODE = 'local'; }
  if (MODE !== 'claude') SETTINGS.guestUrl = location.origin + location.pathname;
  try { applyContent((await db.collection('content').get()).docs); const st = await db.doc('settings/app').get(); if (st.exists) { SETTINGS = Object.assign(SETTINGS, st.data()); ACCEPT_MIN = SETTINGS.acceptMin || 3; } } catch(e){}
  live(db.collection('content'), q => { applyContent(q.docs); rerenderAll(); }, 'content');
  live(db.doc('settings/app'), s => { if (s.exists) { SETTINGS = Object.assign(SETTINGS, s.data()); ACCEPT_MIN = SETTINGS.acceptMin || 3; rerenderAll(); } }, 'settings');
  if (adminEntry) renderAdminLogin(); else if (staffEntry) renderStaffLogin(); else renderLogin();
  if (adminEntry){ const a = store.get('sb_admin'); if (db && a) return startAdmin(a); return; }
  const stf = store.get('sb_staff');
  if (staffEntry){ if (db && stf) { soundOn = false; return startStaff(stf); } return; }
  const sess = store.get('sb_session');
  if (db && sess && sess.id){
    try { const s = await db.doc('stays/'+sess.id).get();
      if (s.exists){ const d = {id:s.id, ...s.data()}; if (d.codeHash===sess.h && (!stayOut(d) || canFarewell(d))) return startSession(d); }
    } catch(e){}
    store.del('sb_session');
  }
})();
