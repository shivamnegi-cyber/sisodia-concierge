<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Moustache Concierge has moved</title>
    <script>
      (function () {
        var NEW = 'https://sisodia-concierge.web.app';
        var h = location.hash || '';
        var target = /^#(admin|staff)/.test(h) ? NEW + '/console/' : NEW + '/' + h;
        location.replace(target);
      })();
    </script>
  </head>
  <body style="font-family:system-ui;text-align:center;padding:40px">
    <p>The concierge has moved. <a href="https://sisodia-concierge.web.app/">Tap here if you are not redirected.</a></p>
  </body>
</html>
