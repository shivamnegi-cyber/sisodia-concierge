  if (d.wznext) { const f = pWiz.f; pWiz.err = '';
    if (pWiz.step === 0 && (!f.name.trim() || !f.city.trim())) { pWiz.err = 'Add the property name and city.'; return renderAdmin(); }
    if (pWiz.step === 0 && PROPS.some(p => p.name.toLowerCase() === f.name.trim().toLowerCase())) { pWiz.err = 'A property with this name already exists.'; return renderAdmin(); }
    if (pWiz.step === 1 && parseRooms(f.rooms).errs.length) { pWiz.err = 'Fix the room lines above, or clear them and add rooms later.'; return renderAdmin(); }
    if (pWiz.step === 2 && f.phone && !/^\d{10}$/.test(f.phone.replace(/\D/g,'').slice(-10))) { pWiz.err = 'Reception mobile needs 10 digits.'; return renderAdmin(); }
    pWiz.step++; window.scrollTo(0,0); return renderAdmin(); }
  if (d.wzcreate) { pWiz.busy = true; renderAdmin();
    try { const id = await createProperty(); const name = pWiz.f.name; pWiz = null; toast(`${name} created.`); await switchProp(id); aSec = 'prop'; renderAdmin(); }
    catch(err){ console.error(err); pWiz.busy = false; pWiz.err = 'Not created. Check the connection and the Firebase rules, then try again.'; renderAdmin(); }
    return; }
  if (d.pseedsave) { try { for (const p of PROPS) await db.doc('properties/' + p.id).set(Object.assign({}, p, {createdAt:Date.now(), createdBy:ME.code})); PROPS_SEEDED = true; toast('Property list saved.'); } catch(err){ toast('Not saved.'); } return renderAdmin(); }
  if (d.pseg) { const p = PROPS.find(x => x.id === d.pseg); if (!p || p.segment === d.seg) return; pConfirm = {id:p.id, seg:d.seg}; window.scrollTo(0,0); return renderAdmin(); }
  if (d.psegno) { pConfirm = null; return renderAdmin(); }
  if (d.psegok) { const p = PROPS.find(x => x.id === pConfirm.id), to = pConfirm.seg, from = p.segment; pConfirm = null;
    try { await db.doc('properties/' + p.id).update({segment:to, updatedAt:Date.now(), updatedBy:ME.code}); p.segment = to; sortProps(); audit('property.segment', `${p.name}: ${SEG_NAME(from)} → ${SEG_NAME(to)}`, p.id);
      if (p.id === PID) { PROP = p; logoImgP = null; qrCache.clear(); skin(to, 'console'); }
      toast(`${p.name} is now ${SEG_NAME(to)}.`); } catch(err){ toast('Not saved. Try again.'); }
    return renderAdmin(); }
  if (d.popen) { await switchProp(d.popen); aSec = 'dashboard'; return renderAdmin(); }
  if (d.pedit) { pEdit = clone(PROPS.find(x => x.id === d.pedit)); return renderAdmin(); }
  if (d.pcancel) { pEdit = null; return renderAdmin(); }
  if (d.psave) { const g = id => document.getElementById(id); const p = PROPS.find(x => x.id === pEdit.id);
    const upd = {name:g('pe-name').value.trim() || p.name, segment:g('pe-seg').value, code:normCode(g('pe-code').value), city:g('pe-city').value.trim(), state:g('pe-state').value.trim(), model:g('pe-model').value, status:g('pe-status').value, guestApp:g('pe-guest').checked, updatedAt:Date.now(), updatedBy:ME.code};
    try { await db.doc('properties/' + p.id).set(Object.assign({}, p, upd));
      if (upd.name !== p.name) { const r = db.doc(`content__${p.id}/prop`); const s = await r.get(); if (s.exists) await r.update({name:upd.name}); else await r.set(Object.assign({}, defaultsFor(Object.assign({}, p, upd)).prop, {name:upd.name})); }
      const changes = Object.keys(upd).filter(k => !/updated/.test(k) && String(upd[k]) !== String(p[k])); Object.assign(p, upd); sortProps();
      if (changes.length) audit('property.edit', `${p.name}: ${changes.join(', ')} updated`, p.id);
      if (p.id === PID) { PROP = p; if (upd.name) P.name = upd.name; logoImgP = null; qrCache.clear(); skin(p.segment, 'console'); }
      pEdit = null; toast('Property saved.'); } catch(err){ toast('Not saved. Try again.'); }
    return renderAdmin(); }
  if (d.plink) { const link = guestLinkFor(d.plink); try { await navigator.clipboard.writeText(link); toast('Guest link copied.'); } catch(err){ toast(link); } return; }
  /* team */
  if (d.ufilter) { uFilter = d.ufilter; return renderAdmin(); }
  if (d.uadd) { uEdit = {code:'', name:'', role: ME.role === 'brand' ? 'gm' : 'fo', dept:'', props:[PID]}; window.scrollTo(0,0); return renderAdmin(); }
  if (d.ucancel) { uEdit = null; return renderAdmin(); }
  if (d.uedit) { const u = uList.find(x => x.code === d.uedit); uEdit = Object.assign(clone(u), {_existing:true}); window.scrollTo(0,0); return renderAdmin(); }
  if (d.ureset) { const u = uList.find(x => x.code === d.ureset); if (!u || !canManage(u)) return;
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to reset'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Reset password'; } }, 4000); return; }
    const pw = tempPw(); try { await db.doc('users/' + u.code).update({pw: await makePw(pw), mustChange:true, ver:(u.ver || 1) + 1, resetBy:ME.code, resetAt:Date.now()}); uTemp = {code:u.code, name:u.name, pw, role:u.role}; audit('user.reset', `Password reset for ${u.name} (${u.code})`); } catch(err){ toast('Not saved.'); }
    return renderAdmin(); }
  if (d.utoggle) { const u = uList.find(x => x.code === d.utoggle); if (!u || !canManage(u) || u.code === ME.code) return;
    try { await db.doc('users/' + u.code).update({active: u.active === false, ver:(u.ver || 1) + 1}); audit('user.toggle', `${u.name} (${u.code}) switched ${u.active === false ? 'on' : 'off'}`); toast(u.active === false ? 'Login switched on.' : 'Login switched off. They are signed out.'); } catch(err){ toast('Not saved.'); }
    return; }
  if (d.uclose) { uTemp = null; return renderAdmin(); }
  if (d.ucopy) { const link = baseUrl() + '#' + (uTemp.role === 'dept' ? 'staff' : 'admin');
    const msg = `Hi ${uTemp.name}, your Moustache Concierge login:\n${link}\nEmployee code: ${uTemp.code}\nTemporary password: ${uTemp.pw}\nYou'll choose your own password when you sign in.`;
    try { await navigator.clipboard.writeText(msg); toast('Copied. Paste it into WhatsApp.'); } catch(err){ toast('Copy is blocked here. Note the code and password on screen.'); } return; }
});
$app.addEventListener('submit', async e => {
  if (!AD) return;
  if (e.target.id === 'uform') { e.preventDefault();
    const f = uEdit, isNew = !f._existing; f.code = normCode(f.code); f.name = (f.name || '').trim();
    if (!/^[A-Z0-9-]{3,20}$/.test(f.code)) return toast('Employee code: 3–20 letters or numbers.');
    if (!f.name) return toast('Add the full name.');
    if (f.role !== 'brand' && !(f.props || []).length) return toast('Tick at least one property.');
    if (ME.role !== 'brand' && !['fo','dept'].includes(f.role)) return toast('Only the brand admin can create this role.');
    if (!isNew && f.code === ME.code && f.role !== ME.role) return toast('You can’t change your own role.');
    const rec = {code:f.code, name:f.name, role:f.role, dept: f.role === 'dept' ? (f.dept || STAFF_DEPTS[0]) : '', props: f.role === 'brand' ? [] : f.props};
    try {
      if (isNew) { const ex = await db.doc('users/' + f.code).get(); if (ex.exists) return toast('That employee code already has a login.');
        const pw = tempPw(); await db.doc('users/' + f.code).set(Object.assign(rec, {active:true, mustChange:true, ver:1, pw: await makePw(pw), createdAt:Date.now(), createdBy:ME.code}));
        uTemp = {code:f.code, name:f.name, pw, role:f.role, isNew:true}; audit('user.create', `Login created for ${f.name} (${f.code}) as ${ROLES[f.role]}`); }
      else { await db.doc('users/' + f.code).update(Object.assign(rec, {updatedAt:Date.now(), updatedBy:ME.code})); audit('user.edit', `${f.name} (${f.code}) updated: ${ROLES[f.role]}`); toast('Saved.'); }
      uEdit = null;
    } catch(err){ toast('Not saved. Check the connection and try again.'); }
    return renderAdmin(); }
  if (e.target.id === 'acform') { e.preventDefault();
    const o = document.getElementById('ac-old').value, a = document.getElementById('ac-1').value, b2 = document.getElementById('ac-2').value;
    const bad = pwProblem(a, b2); if (bad) return toast(bad);
    try { const s = await db.doc('users/' + ME.code).get(); const u = s.data(); if (await pbkdf2(o, u.pw.salt, u.pw.iter) !== u.pw.hash) return toast('Your current password is not right.');
      const ver = (u.ver || 1) + 1, prev = ME.ver, pw = await makePw(a); ME.ver = ver; store.set('mc_me', {code:ME.code, ver});
      try { await db.doc('users/' + ME.code).update({pw, ver, pwChangedAt:Date.now()}); } catch(err2){ ME.ver = prev; store.set('mc_me', {code:ME.code, ver:prev}); throw err2; }
      e.target.reset(); toast('Password changed.'); }
    catch(err){ toast('Not saved. Try again.'); }
    return; }
});

const placeLine = () => [P.name, PROP && PROP.city].filter(Boolean).join(' · ');
const spaced = t => String(t).toUpperCase().split('').join(' ').replace(/ {3}/g, '   ');
/* ---------- BOOT ---------- */
window.addEventListener('hashchange', () => location.reload());
$app.innerHTML = '<div class="login"><div style="margin:auto;color:var(--soft);font-size:14px">Loading concierge…</div></div>';
(async () => {
  try { db = await connectDb(); } catch(e){ db = localDb(); MODE = 'local'; }
  PLATFORM_URL = MODE === 'claude' ? CLAUDE_URL : location.origin + location.pathname;
  const R = route();
  if (R.entry) {
    ENTRY = R.entry; skin('master');
    await loadProps(); watchProps();
    const has = await usersExist();
    if (has === false) return renderSetup();
    if (await resumeMe()) return enterConsole();
    return renderTeamLogin(has === null ? 'We couldn’t reach the server. Check the internet and refresh the page.' : null);
  }
  await loadProps();
  const sess = store.get('sb_session');
  const pid = R.pid || (sess && sess.pid) || DEFAULT_PID;
  const prop = PROPS.find(p => p.id === pid);
  if (!prop) { PROP = null; skin('master'); return renderGuestNotice('This link isn’t active', 'Please scan the QR card in your room again, or ask the front desk for your link.'); }
  await usePid(pid, 'guest'); watchProps();
  if (prop.status === 'Closed' || prop.guestApp === false) return renderGuestNotice(P.greet || 'Welcome', `The digital concierge isn’t available at ${P.name} right now. Please call the front desk${P.ext ? ' on Ext. ' + P.ext : ''}.`);
  renderLogin();
  if (db && sess && sess.id && (sess.pid || DEFAULT_PID) === pid) {
    try { const s = await pdb.doc('stays/' + sess.id).get();
      if (s.exists) { const d = {id:s.id, ...s.data()}; if (d.codeHash === sess.h && (!stayOut(d) || canFarewell(d))) return startSession(d); }
    } catch(e){}
    store.del('sb_session');
  }
})();
</script>
